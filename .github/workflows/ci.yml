{
  "name": "Verify native hosts",
  "on": { "push": null, "pull_request": null },
  "permissions": { "contents": "read" },
  "jobs": {
    "rust": {
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "fail-fast": false,
        "matrix": { "os": ["ubuntu-latest", "windows-latest", "macos-latest"] }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": { "fetch-depth": 0 }
        },
        {
          "name": "Prepare native Rust",
          "shell": "pwsh",
          "run": "rustup toolchain install stable --profile minimal --component rustfmt --component clippy\nif ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }\nrustup default stable\nif ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed.' }"
        },
        {
          "name": "Full native repository gate",
          "shell": "pwsh",
          "env": {
            "ARCHITECTURE_BASE": "${{ github.event.pull_request.base.sha || github.event.before }}"
          },
          "run": "./tools/Test-Repository.ps1 -BaseRef $env:ARCHITECTURE_BASE"
        },
        {
          "name": "Required portable real-binary stdio suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp --test portable_stdio"
        },
        {
          "name": "Required portable remote execution suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-backend-ssh --test remote"
        },
        {
          "name": "Required portable age suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-crypto-age --test provider"
        },
        {
          "name": "Required portable key-purpose orchestration suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-runtime --test protection"
        },
        {
          "name": "Required portable MCP protocol suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-transport --test protocol"
        }
      ]
    }
  }
}
