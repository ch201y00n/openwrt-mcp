{
  "name": "Verify native hosts",
  "on": { "push": null, "pull_request": null },
  "permissions": { "contents": "read" },
  "jobs": {
    "rust": {
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "fail-fast": false,
        "matrix": { "os": ["ubuntu-latest", "windows-latest", "macos-latest"] }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": { "fetch-depth": 0 }
        },
        {
          "name": "Prepare native Rust",
          "shell": "pwsh",
          "run": "rustup toolchain install stable --profile minimal --component rustfmt --component clippy\nif ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }\nrustup default stable\nif ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed.' }"
        },
        {
          "name": "Full native repository gate",
          "shell": "pwsh",
          "env": {
            "ARCHITECTURE_BASE": "${{ github.event.pull_request.base.sha || github.event.before }}"
          },
          "run": "./tools/Test-Repository.ps1 -BaseRef $env:ARCHITECTURE_BASE"
        },
        {
          "name": "Required native Windows protected read suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-host-platform --test windows"
        },
        {
          "name": "Required portable real-binary stdio suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp --test portable_stdio"
        },
        {
          "name": "Required portable remote execution suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-backend-ssh --test remote"
        },
        {
          "name": "Required portable age suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-crypto-age --test provider"
        },
        {
          "name": "Required portable key-purpose orchestration suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-runtime --test protection"
        },
        {
          "name": "Required portable MCP protocol suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-transport --test protocol"
        },
        {
          "name": "Required portable operation capability contract suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-features --test capability_contracts"
        },
        {
          "name": "Required portable capability lifecycle suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-runtime --test capabilities"
        },
        {
          "name": "Required portable ubus describe codec suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-device-codec --test ubus_describe"
        },
        {
          "name": "Required portable collection projection suite",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-core --test collection_projection"
        },
        {
          "name": "Required portable collection operation contracts",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-features --test collection_contracts"
        },
        {
          "name": "Required portable bounded projection lifecycle",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-runtime --test collection_projection"
        },
        {
          "name": "Required portable strict action response codec",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-device-codec --test action_response"
        },
        {
          "name": "Required portable bounded MCP results",
          "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-transport --test bounded_results"
        },
        {
          "name": "Required portable package records", "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-core --test packages"
        },
        {
          "name": "Required portable package definitions", "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-features --test packages"
        },
        {
          "name": "Required portable package lifecycle", "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-runtime --test packages"
        },
        {
          "name": "Required portable package codec", "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-device-codec --test packages"
        },
        {
          "name": "Required portable package protocol", "shell": "pwsh",
          "run": "cargo test --locked -p openwrt-mcp-transport --test packages"
        }
      ]
    }
  }
}
