version = 9
decision = "docs/adr/0009-reviewed-luci-observations.md"
requirements = "docs/requirements.md"
architecture = "docs/architecture.md"
required_hosts = ["windows", "linux", "macos"]
portable_crates = ["openwrt-mcp-core", "openwrt-mcp-features", "openwrt-mcp-runtime", "openwrt-mcp-transport", "openwrt-mcp-crypto-age", "openwrt-mcp-backend-ssh", "openwrt-mcp-device-codec"]
required_portable_tests = ["crates/server/tests/portable_stdio.rs", "crates/backend-ssh/tests/remote.rs", "crates/crypto-age/tests/provider.rs", "crates/runtime/tests/protection.rs", "crates/mcp/tests/protocol.rs", "crates/features/tests/capability_contracts.rs", "crates/runtime/tests/capabilities.rs", "crates/device-codec/tests/ubus_describe.rs", "crates/core/tests/collection_projection.rs", "crates/features/tests/collection_contracts.rs", "crates/runtime/tests/collection_projection.rs", "crates/device-codec/tests/action_response.rs", "crates/mcp/tests/bounded_results.rs", "crates/core/tests/packages.rs", "crates/features/tests/packages.rs", "crates/runtime/tests/packages.rs", "crates/device-codec/tests/packages.rs", "crates/mcp/tests/packages.rs"]
native_ci = ".github/workflows/ci.yml"

[windows_read_contract]
owner = "openwrt-mcp-host-platform"
native_file = "crates/host-platform/src/windows/native.rs"
policy_file = "crates/host-platform/src/windows/policy.rs"
profile = "local_ntfs_handle_walk_v1"
paths = "absolute_dos_no_alias_stream_or_reparse"
ancestors = "held_no_delete_share_trusted_owner_dacl"
leaf = "single_link_read_only_share"
descriptor = "bounded_self_relative_conservative_allow_aces"
trusted = "process_user_system_administrators_root_trustedinstaller"
vault = "unsupported_no_fallback"
unsafe_scope = "expressions_in_native_file_only"
sdk = "windows-sys_0.61.2_windows_only"
capabilities = "separate_protected_reads_and_private_log"
max_path_units = 4096
max_components = 128
max_descriptor_bytes = 65536
max_token_bytes = 4096
required_test = "crates/host-platform/tests/windows.rs"

[package_contract]
domain_owner = "openwrt-mcp-core"
workflow_owner = "openwrt-mcp-runtime"
codec_owner = "openwrt-mcp-device-codec"
entropy_owner = "openwrt-mcp-adapters"
profile = "apk_3_0_5_visible_v1"
admission = "same_backend_version_and_complete_query"
permission = "packages_read"
snapshot = "single_private_immutable"
continuation = "nonce_operation_epoch_absolute_ttl"
refresh = "invalidate_before_attempt"
capability_status = "unknown_capture_required"
whole_device_complete = false
max_source_bytes = 4194304
max_records = 4096
max_retained_bytes = 2097152
page_records = 16
ttl_seconds = 120
nonce_bytes = 16
max_name_bytes = 256
max_version_bytes = 256
max_arch_bytes = 64
required_tests = ["crates/core/tests/packages.rs", "crates/features/tests/packages.rs", "crates/runtime/tests/packages.rs", "crates/device-codec/tests/packages.rs", "crates/mcp/tests/packages.rs"]

[capability_contract]
probe_profile = "base_luci_v2"
probe_registry = "architecture/capability-probes.toml"
evidence_manifest = "compatibility/evidence.toml"
required_tests = ["crates/features/tests/capability_contracts.rs", "crates/runtime/tests/capabilities.rs", "crates/device-codec/tests/ubus_describe.rs"]

[projection_contract]
owner = "openwrt-mcp-core"
profile = "typed_collections_v1"
prepared_invocation = "private_core"
node_forms = ["Record", "ObjectArray", "ObjectEntries", "ScalarArray"]
finite_schema = "two_collection_levels"
root_selection = "exact_parameter_equality"
map_keys = "explicit_bounded_field"
builtin_raw_subtrees = "forbidden"
invalid_shape = "reject"
overflow = "reject"
max_collection_depth = 2
max_collection_nodes = 8
max_total_items = 256
max_emitted_items = 256
max_items_per_collection = 256
max_fields_per_record = 64
max_schema_depth = 8
max_pointer_depth = 8
max_pointer_bytes = 512
max_output_name_bytes = 64
max_string_bytes = 1024
max_normalized_bytes = 65536
required_tests = ["crates/core/tests/collection_projection.rs", "crates/features/tests/collection_contracts.rs", "crates/runtime/tests/collection_projection.rs"]

[action_response_contract]
owner = "openwrt-mcp-device-codec"
profile = "strict_json_v1"
consumers = ["openwrt-mcp-adapters", "openwrt-mcp-backend-ssh"]
duplicate_keys = "reject"
max_depth = 32
max_nodes = 65536
max_bytes = 16777216
required_tests = ["crates/device-codec/tests/action_response.rs"]

[mcp_result_contract]
owner = "openwrt-mcp-transport"
normalized_owner = "openwrt-mcp-runtime"
normalized_phase = "before_finish_audit"
max_serialized_bytes = 262144
serialized_scope = "entire_call_tool_result"
required_tests = ["crates/mcp/tests/bounded_results.rs"]

[[crates]]
name = "openwrt-mcp-core"
path = "crates/core"
layer = "domain"
dependencies = ["serde", "serde_json", "thiserror"]
dev_dependencies = ["toml"]
build_dependencies = []
forbidden_paths = ["std::fs", "std::io", "std::net", "std::os", "std::process", "std::thread", "std::env", "tokio"]
allowed_macros = ["json", "matches", "vec", "format", "write", "writeln", "assert", "assert_eq", "assert_ne", "debug_assert", "debug_assert_eq", "unreachable"]

