version = 5
decision = "docs/adr/0005-capability-observations.md"
requirements = "docs/requirements.md"
architecture = "docs/architecture.md"
required_hosts = ["windows", "linux", "macos"]
portable_crates = ["openwrt-mcp-core", "openwrt-mcp-features", "openwrt-mcp-runtime", "openwrt-mcp-transport", "openwrt-mcp-crypto-age", "openwrt-mcp-backend-ssh", "openwrt-mcp-device-codec"]
required_portable_tests = ["crates/server/tests/portable_stdio.rs", "crates/backend-ssh/tests/remote.rs", "crates/crypto-age/tests/provider.rs", "crates/runtime/tests/protection.rs", "crates/mcp/tests/protocol.rs", "crates/features/tests/capability_contracts.rs", "crates/runtime/tests/capabilities.rs", "crates/device-codec/tests/ubus_describe.rs"]
native_ci = ".github/workflows/ci.yml"

[capability_contract]
probe_registry = "architecture/capability-probes.toml"
evidence_manifest = "compatibility/evidence.toml"
required_tests = ["crates/features/tests/capability_contracts.rs", "crates/runtime/tests/capabilities.rs", "crates/device-codec/tests/ubus_describe.rs"]

