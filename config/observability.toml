# Opt-in example for all currently implemented built-in read categories.
# No write or execute grants; missing categories remain denied.
# Wireless.Read includes station MAC identities and passive link metrics.
# Deny wireless_stations and wireless_station_status to hide client identities.
# Services.Read includes generic service/instance names and running/PID metadata,
# including VPN/firewall-related daemons, but not configuration or command lines.
# For narrower service visibility, deny service_status and service_status_list
# with policy.deny_operations, retaining the fixed logd/sysntpd status operations.
[policy.categories.system]
access = "read"
execute = false

[policy.categories.network]
access = "read"
execute = false

[policy.categories.wireless]
access = "read"
execute = false

[policy.categories.services]
access = "read"
execute = false

[policy.categories.diagnostics]
access = "read"
execute = false

# Exact package names/versions/architectures; non-atomic APK-visible observation.
[policy.categories.packages]
access = "read"
execute = false

[audit]
enabled = true
format = "json"
destination = "stderr"

[logging]
level = "info"
format = "json"
