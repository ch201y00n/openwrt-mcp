[workspace]
resolver = "3"
members = ["crates/core", "crates/features", "crates/runtime", "crates/adapters", "crates/mcp", "crates/server", "crates/crypto-age", "crates/key-sources", "crates/host-platform", "crates/backend-ssh", "crates/device-codec", "tools/xtask"]
default-members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/ch201y00n/openwrt-mcp"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "process", "time", "sync"] }
async-trait = "0.1"
rmcp = { version = "=3.3.0", default-features = false, features = ["server", "transport-io"] }
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"
zeroize = "1"
getrandom = "=0.4.3"
windows-sys = { version = "=0.61.2", default-features = false, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }
# Maintained X25519-compatible line; see ADR 0004 for the SSH/PQ dependency conflict.
age = { version = "=0.11.5", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
rustix = { version = "1", features = ["fs", "process"] }
russh = { version = "=0.63.3", default-features = false, features = ["ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
