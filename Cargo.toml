[workspace]
resolver = "3"
members = ["crates/core", "crates/features", "crates/runtime", "crates/adapters", "crates/mcp", "crates/server", "tools/xtask"]
default-members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/ch201y00n/openwrt-mcp"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "process", "time", "sync"] }
async-trait = "0.1"
rmcp = { version = "=3.3.0", default-features = false, features = ["server", "transport-io"] }
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
